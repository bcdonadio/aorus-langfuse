extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
    compaction:
      directory: /var/lib/otelcol/compaction
      on_start: true
      on_rebound: true

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 192
  batch/logs:
    timeout: 2s
    send_batch_size: 1024
    send_batch_max_size: 2048
  batch/metrics:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048
  batch/traces:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  deltatocumulative:
    max_stale: 5m
    max_streams: 10000

exporters:
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
  otlphttp/metrics:
    endpoint: http://prometheus:9090/api/v1/otlp
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
  otlphttp/traces:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: ${env:LANGFUSE_AUTH_HEADER}
      x-langfuse-ingestion-version: "4"
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions:
    - file_storage
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch/logs
      exporters:
        - otlphttp/logs
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - deltatocumulative
        - batch/metrics
      exporters:
        - otlphttp/metrics
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch/traces
      exporters:
        - otlphttp/traces
